data:
  path: datasets/electricity
  name: null
  config_path: null
  date_col: null
  target_cols: null
  covariate_cols: null
  covariate_paths: null
  covariate_mode: none  # none | identity | known
  drop_users: []
  aggr: null
  aggr_period: null

task:
  lags: 168
  horizon: 24

model:
  name: repeat  # persistence | expected | repeat | lookback | chronos2 | chronos_bolt | ts_icl | tirex2 | tabpfn_ts
  device: cuda
  weights_path: null
  lookback_period: null  # inferred as one week from dated inputs
  local_files_only: true
  cross_learning: false
  quantile_index: null
  quantile_level: 0.5
  seasonal_periods: [24, 168]
  use_time_features: true
  kwargs:
    random_state: ${evaluation.seed}

preprocessing:
  instance_normalize: true
  eps: 1.0e-8

evaluation:
  stride: 512
  batch_size: 64
  remove_constant: false
  start_fraction: 0.0
  end_fraction: 1.0
  seed: 1
  save_window_metrics: true
  mase_seasonality: 1

output:
  dir: outputs/univariate
  workflow: univariate
  model_config_order: [covariate_mode, normalization, constant_policy, time_features]
  row_config: [covariate_mode]
  column_config: [normalization, constant_policy, time_features]
  purpose: development
  mode: null
  conflict_policy: overwrite_exact
  force: false
  run_index: null
  launch_id: null
  skip_completed: true

misc:
  log_level: INFO

hydra:
  run:
    dir: .
  output_subdir: null
