[project]
name = "tsfm-evaluation"
version = "0.1.0"
description = "Deterministic inference-only evaluation of time-series foundation models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.3.1",
    "huggingface-hub>=1.27.0",
    "hydra-core>=1.3.5",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch==2.5.1",
    "tsicl>=0.2.1",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conf = ["*.yaml"]
