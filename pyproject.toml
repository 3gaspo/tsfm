[project]
name = "tsfm-evaluation"
version = "0.1.0"
description = "Deterministic inference-only evaluation of time-series foundation models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting==2.0.1",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.19.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "tabpfn==6.3.1",
    "tirex-2==0.2.1",
    "torch>=2.8.0,<2.10",
    "tsicl==0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conf = ["*.yaml"]
